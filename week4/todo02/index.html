<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>todo02 — PostgreSQL 에 쌓이는 투두</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" />
<style>
  /* todo01 과 같은 디자인 언어(수업 사이트 Comfy Classroom 기준) */
  :root {
    --bg: #f6f8fc; --ink: #17213c; --radius: 14px;
    --navy: #182d69; --navy-2: #101f4c;
    --brand: #254bdb; --brand-ink: #18349f; --brand-soft: #edf2ff; --brand-lift: #87a0ff;
    --panel: #ffffff; --panel-2: #fbfcfe;
    --line: #dce2ec; --line-soft: #e8ecf3;
    --dim: #52637e; --faint: #8992a3;
    --ok: #2f9e6b; --danger: #d94f4f;
    --shadow: 0 18px 44px -28px rgba(24,45,105,.42);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "DM Sans", "Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }

  .app { display: grid; grid-template-columns: minmax(0, 46fr) minmax(0, 54fr); min-height: 100vh; }

  /* ---------- 왼쪽 네이비 패널 ---------- */
  .side {
    background: var(--navy); color: #fff; padding: 34px 40px;
    display: flex; flex-direction: column; gap: 28px;
    position: sticky; top: 0; height: 100vh;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(140deg, #4465db, #254bdb); font-size: 15px; font-weight: 700; color: #fff;
  }
  .logo b { font-size: 19px; font-weight: 700; letter-spacing: -.2px; }
  .logo span { font-size: 19px; color: #a8b6e4; font-weight: 400; }

  .side .eyebrow { color: var(--brand-lift); }
  .side h1 { margin: 10px 0 0; font-size: 38px; line-height: 1.22; font-weight: 700; letter-spacing: -1px; }
  .side p.lead { margin: 16px 0 0; color: #c2cbe6; font-size: 14.5px; line-height: 1.75; }

  .steps { display: flex; flex-direction: column; gap: 13px; margin: 0; padding: 0; list-style: none; }
  .steps li { display: flex; align-items: center; gap: 14px; font-size: 14px; color: #dbe2f4; }
  .steps .n {
    width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid rgba(135,160,255,.45); color: var(--brand-lift);
    font-size: 11.5px; font-weight: 600; font-family: "IBM Plex Mono", monospace;
  }
  .steps code { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: #fff; background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 5px; }

  .dbcard { border: 1px solid rgba(135,160,255,.28); border-radius: 12px; padding: 13px 14px; background: rgba(255,255,255,.04); }
  .dbcard .row { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .dbcard .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dbcard .dot.on { background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.18); }
  .dbcard .dot.off { background: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,.18); }
  .dbcard .meta { margin-top: 8px; font-size: 11.5px; color: #8ca1d8; font-family: "IBM Plex Mono", monospace; word-break: break-all; line-height: 1.7; }

  .side .foot { margin-top: auto; display: flex; justify-content: space-between; gap: 16px; font-size: 12px; color: #8ca1d8; }

  /* ---------- 오른쪽 작업 영역 ---------- */
  .main { background: #fff; padding: 46px 52px 70px; min-width: 0; }
  .main .inner { max-width: 580px; }
  .main h2 { margin: 8px 0 6px; font-size: 27px; font-weight: 700; letter-spacing: -.6px; }
  .main .say { margin: 0 0 26px; color: var(--faint); font-size: 13.5px; }

  form.add label.f { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 7px; }
  .row { display: flex; gap: 8px; }
  input[type="text"], input[type="search"] {
    flex: 1; min-width: 0; background: #fff; border: 1px solid var(--line);
    border-radius: 11px; padding: 13px 14px; outline: none; font-size: 14.5px; transition: .15s;
  }
  input::placeholder { color: #b6bdcb; }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,75,219,.12); }
  form.add select {
    border: 1px solid var(--line); border-radius: 11px; padding: 0 12px; background: #fff;
    outline: none; font-size: 13.5px; color: var(--dim);
  }
  form.add button.go {
    border: 0; border-radius: 11px; padding: 0 22px; background: var(--brand); color: #fff;
    font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; transition: .15s;
  }
  form.add button.go:hover:not(:disabled) { background: var(--brand-ink); }
  form.add button.go:disabled { background: #c3cbe0; cursor: not-allowed; }

  .search { margin-top: 14px; position: relative; }
  .search input { width: 100%; padding-left: 38px; font-size: 13.5px; padding-top: 10px; padding-bottom: 10px; }
  .search::before { content: "⌕"; position: absolute; left: 14px; top: 50%; transform: translateY(-52%); color: var(--faint); font-size: 16px; }

  .tabs { display: flex; border-bottom: 1px solid var(--line); margin: 26px 0 4px; }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    padding: 11px 18px; font-size: 14px; color: var(--faint); font-weight: 500; transition: .15s;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-pressed="true"] { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
  .tabs .right { margin-left: auto; display: flex; align-items: center; gap: 10px; padding-bottom: 6px; }
  .ghost {
    border: 1px solid var(--line); background: #fff; color: var(--dim);
    border-radius: 9px; padding: 5px 11px; font-size: 12.5px; transition: .15s;
  }
  .ghost:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .ghost:disabled { opacity: .45; cursor: not-allowed; }

  ul.list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  li.item {
    display: flex; align-items: flex-start; gap: 13px;
    background: #fff; border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 14px 15px; box-shadow: 0 1px 2px rgba(24,45,105,.04); transition: .15s;
  }
  li.item:hover { border-color: var(--line); box-shadow: var(--shadow); }
  li.item.done { background: var(--panel-2); }
  li.item .check {
    width: 21px; height: 21px; flex: none; margin-top: 2px; border-radius: 7px;
    border: 1.5px solid #c3ccdd; background: #fff; display: grid; place-items: center;
    font-size: 12px; color: #fff; transition: .15s;
  }
  li.item .check:hover { border-color: var(--brand); }
  li.item.done .check { background: var(--brand); border-color: var(--brand); }
  li.item .body { flex: 1; min-width: 0; }
  li.item .text { font-size: 14.5px; word-break: break-word; cursor: text; }
  li.item.done .text { color: var(--faint); text-decoration: line-through; text-decoration-color: #c3ccdd; }
  li.item .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; font-size: 11.5px; color: var(--faint); font-family: "IBM Plex Mono", monospace; }
  li.item .meta .tag { border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; background: var(--panel-2); }
  .tag.p높음 { color: #c0392b; border-color: #f4d4d1; background: #fff5f4; }
  .tag.p보통 { color: var(--brand); border-color: #d7e0ff; background: var(--brand-soft); }
  .tag.p낮음 { color: var(--faint); }
  li.item .edit {
    width: 100%; background: #fff; border: 1px solid var(--brand);
    border-radius: 9px; padding: 8px 10px; outline: none; font-size: 14.5px;
    box-shadow: 0 0 0 3px rgba(37,75,219,.12);
  }
  li.item .x { border: 0; background: transparent; color: #b6bdcb; font-size: 15px; padding: 2px 5px; border-radius: 7px; flex: none; }
  li.item .x:hover { color: var(--danger); background: #fbeeed; }

  .empty { text-align: center; color: var(--faint); padding: 48px 20px; border: 1px dashed var(--line); border-radius: var(--radius); margin-top: 14px; font-size: 13.5px; }
  .empty .big { font-size: 28px; margin-bottom: 8px; }

  .banner { border-radius: 12px; padding: 13px 15px; font-size: 13px; line-height: 1.75; margin-bottom: 20px; }
  .banner.err { background: #fbeeed; border: 1px solid #f4d4d1; color: #9e3b32; }
  .banner code { font-family: "IBM Plex Mono", monospace; background: rgba(0,0,0,.05); padding: 1px 6px; border-radius: 5px; }
  .banner pre { margin: 9px 0 0; background: rgba(0,0,0,.05); border-radius: 8px; padding: 10px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; overflow-x: auto; color: #6b3b36; }

  .rows { margin-top: 30px; border-top: 1px solid var(--line-soft); padding-top: 18px; }
  .rows summary { cursor: pointer; font-size: 13px; color: var(--dim); list-style: none; display: flex; align-items: center; gap: 8px; }
  .rows summary::-webkit-details-marker { display: none; }
  .rows summary::before { content: "▸"; color: var(--faint); transition: transform .15s; }
  .rows[open] summary::before { transform: rotate(90deg); }
  .tablewrap { margin-top: 12px; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table.rowsview { border-collapse: collapse; width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }
  table.rowsview th, table.rowsview td { text-align: left; padding: 8px 11px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  table.rowsview th { background: var(--panel-2); color: var(--dim); font-weight: 600; }
  table.rowsview tr:last-child td { border-bottom: 0; }
  table.rowsview td.t { white-space: normal; min-width: 180px; font-family: "DM Sans", "Noto Sans KR", sans-serif; }
  .sqlnote { margin-top: 10px; font-size: 11.5px; color: var(--faint); }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--navy); color: #fff; border-radius: 11px;
    padding: 10px 18px; font-size: 13px; box-shadow: 0 18px 40px -18px rgba(24,45,105,.7);
  }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; padding: 26px 22px 30px; gap: 20px; }
    .side h1 { font-size: 27px; }
    .side .steps, .side .foot { display: none; }
    .main { padding: 28px 22px 60px; }
    .main .inner { max-width: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* 모든 변경은 서버(그리고 PostgreSQL)를 거치고, 돌려받은 목록을 그대로 그린다. */
async function api(path, options) {
  const res = await fetch('api/' + path, Object.assign({ cache: 'no-store' }, options, {
    headers: options && options.body ? { 'Content-Type': 'application/json' } : undefined
  }));
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) throw new Error((data && data.detail) || ('서버 오류 ' + res.status));
  return data;
}

function Item({ todo, onToggle, onEdit, onRemove, busy }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(todo.text);
  const ref = useRef(null);
  useEffect(() => { if (editing && ref.current) { ref.current.focus(); ref.current.select(); } }, [editing]);
  useEffect(() => { setDraft(todo.text); }, [todo.text]);

  const commit = () => {
    const v = draft.trim();
    setEditing(false);
    if (v && v !== todo.text) onEdit(todo, v); else setDraft(todo.text);
  };
  return (
    <li className={'item' + (todo.done ? ' done' : '')}>
      <button className="check" onClick={() => onToggle(todo)} disabled={busy}
        aria-label={todo.done ? '완료 취소' : '완료로 표시'}>{todo.done ? '✔' : ''}</button>
      <div className="body">
        {editing ? (
          <input ref={ref} className="edit" value={draft}
            onChange={e => setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e => {
              if (e.key === 'Enter') { e.preventDefault(); commit(); }
              if (e.key === 'Escape') { setDraft(todo.text); setEditing(false); }
            }} />
        ) : (
          <div className="text" onDoubleClick={() => setEditing(true)} title="더블클릭하면 고칠 수 있습니다">{todo.text}</div>
        )}
        <div className="meta">
          <span className={'tag p' + todo.priority}>{todo.priority}</span>
          <span>{todo.created}</span>
          {todo.done && todo.doneAt && <span>완료 {todo.doneAt}</span>}
          <span style={{ opacity: .65 }}>id {todo.id}</span>
        </div>
      </div>
      <button className="x" onClick={() => onRemove(todo)} disabled={busy} title="삭제">✕</button>
    </li>
  );
}

function App() {
  const [todos, setTodos] = useState([]);
  const [stats, setStats] = useState({ total: 0, done: 0 });
  const [db, setDb] = useState(null);
  const [connected, setConnected] = useState(null);
  const [priorities, setPriorities] = useState(['높음', '보통', '낮음']);
  const [text, setText] = useState('');
  const [priority, setPriority] = useState('보통');
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [error, setError] = useState(null);
  const [ready, setReady] = useState(false);
  const [busy, setBusy] = useState(false);
  const [toast, setToast] = useState(null);

  const say = useCallback(msg => {
    setToast(msg);
    setTimeout(() => setToast(t => (t === msg ? null : t)), 2000);
  }, []);

  const apply = data => {
    setTodos(data.todos || []);
    if (data.stats) setStats(data.stats);
    if (data.priorities) setPriorities(data.priorities);
    if (data.db) setDb(data.db);
    setConnected(true);
    setError(null);
  };
  const run = async (fn, okMsg) => {
    setBusy(true);
    try { apply(await fn()); if (okMsg) say(okMsg); }
    catch (e) { setError(e.message); setConnected(false); }
    setBusy(false);
  };

  const load = useCallback(async (q) => {
    try {
      apply(await api('todos' + (q ? '?q=' + encodeURIComponent(q) : '')));
    } catch (e) {
      setError(e.message);
      setConnected(false);
      try { const h = await api('health'); if (h.db) setDb(h.db); } catch (e2) {}
    }
    setReady(true);
  }, []);

  useEffect(() => { load(''); }, [load]);

  // 검색어는 조금 기다렸다가 SQL 로 보낸다 (타이핑마다 질의하지 않도록)
  useEffect(() => {
    if (!ready) return;
    const t = setTimeout(() => { load(search.trim()); }, 300);
    return () => clearTimeout(t);
  }, [search]);

  const add = e => {
    e.preventDefault();
    const v = text.trim();
    if (!v || busy) return;
    setText('');
    run(() => api('todos', { method: 'POST', body: JSON.stringify({ text: v, priority }) }), 'DB 에 저장했습니다');
  };
  const toggle = t => run(() => api('todos/' + t.id, { method: 'PATCH', body: JSON.stringify({ done: !t.done }) }));
  const edit = (t, v) => run(() => api('todos/' + t.id, { method: 'PATCH', body: JSON.stringify({ text: v }) }), '수정했습니다');
  const remove = t => run(() => api('todos/' + t.id, { method: 'DELETE' }), '지웠습니다');
  const clearDone = () => run(() => api('todos/clear-done', { method: 'POST' }), '완료된 항목을 지웠습니다');

  const left = todos.filter(t => !t.done).length;
  const doneShown = todos.length - left;
  const shown = useMemo(() => (
    filter === 'todo' ? todos.filter(t => !t.done)
      : filter === 'done' ? todos.filter(t => t.done)
        : todos
  ), [todos, filter]);

  return (
    <div className="app">
      <aside className="side">
        <div className="logo">
          <div className="mark">DB</div>
          <b>todo</b><span>02</span>
        </div>

        <div>
          <div className="eyebrow">saved in postgresql</div>
          <h1>적는 순간<br />DB 에 들어갑니다.</h1>
          <p className="lead">
            파일이 아니라 PostgreSQL 테이블에 한 행으로 저장됩니다.<br />
            다른 기기에서 열어도 같은 목록이 보입니다.
          </p>
        </div>

        <ul className="steps">
          <li><span className="n">01</span> 할 일 적기</li>
          <li><span className="n">02</span> <code>INSERT INTO todos</code></li>
          <li><span className="n">03</span> 어디서 열어도 같은 목록</li>
        </ul>

        <div className="dbcard">
          <div className="row">
            <span className={'dot ' + (connected ? 'on' : 'off')} />
            {connected === null ? '연결 확인 중…' : connected ? 'PostgreSQL 연결됨' : 'DB 연결 안 됨'}
          </div>
          <div className="meta">
            {db ? (db.host + ' / ' + db.database) : 'DATABASE_URL 미설정'}
            <br />{stats.total}건 저장 · 완료 {stats.done}건
          </div>
        </div>

        <div className="foot">
          <span>todos 테이블</span>
          <span>{ready && connected ? (left ? '남은 일 ' + left + '개' : todos.length ? '다 끝냈습니다' : '비어 있음') : ''}</span>
        </div>
      </aside>

      <main className="main">
        <div className="inner">
          <div className="eyebrow">오늘의 할 일</div>
          <h2>무엇부터 할까요?</h2>
          <p className="say">적고 엔터를 누르면 DB 에 바로 들어갑니다.</p>

          {error && (
            <div className="banner err">
              ⚠ {error}
              {connected === false && (
                <>
                  <br />이 폴더에 <code>.env</code> 를 만들고 접속 URL 을 넣은 뒤 서버를 다시 실행하세요.
                  <pre>{'DATABASE_URL=postgresql://사용자:비밀번호@호스트:5432/DB이름\n\nnpm install\nnode server.js   # → http://localhost:8789'}</pre>
                </>
              )}
              <button className="ghost" style={{ marginTop: 10 }} onClick={() => load(search.trim())}>다시 시도</button>
            </div>
          )}

          <form className="add" onSubmit={add}>
            <label className="f" htmlFor="newtodo">할 일</label>
            <div className="row">
              <input id="newtodo" type="text" value={text} onChange={e => setText(e.target.value)} maxLength={500}
                placeholder="예: 목요일까지 과제 제출" />
              <select value={priority} onChange={e => setPriority(e.target.value)} aria-label="우선순위">
                {priorities.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
              <button className="go" type="submit" disabled={!text.trim() || busy}>추가 <span>→</span></button>
            </div>
          </form>

          <div className="search">
            <input type="search" value={search} onChange={e => setSearch(e.target.value)}
              placeholder="내용으로 검색 (DB 에서 ILIKE 로 찾습니다)" />
          </div>

          <div className="tabs">
            <button aria-pressed={filter === 'all'} onClick={() => setFilter('all')}>전체 {todos.length}</button>
            <button aria-pressed={filter === 'todo'} onClick={() => setFilter('todo')}>할 일 {left}</button>
            <button aria-pressed={filter === 'done'} onClick={() => setFilter('done')}>완료 {doneShown}</button>
            <div className="right">
              <button className="ghost" onClick={clearDone} disabled={!stats.done || busy}>완료 지우기</button>
            </div>
          </div>

          {shown.length ? (
            <ul className="list">
              {shown.map(t => (
                <Item key={t.id} todo={t} busy={busy} onToggle={toggle} onEdit={edit} onRemove={remove} />
              ))}
            </ul>
          ) : ready && !error ? (
            <div className="empty">
              <div className="big">{search ? '🔍' : filter === 'done' ? '🗂' : '🗃'}</div>
              {search ? '"' + search + '" 에 맞는 할 일이 없습니다.'
                : filter === 'done' ? '완료한 일이 아직 없습니다.'
                  : filter === 'todo' ? '할 일이 남아 있지 않습니다.'
                    : '첫 할 일을 적어보세요. 적는 순간 todos 테이블에 한 행이 들어갑니다.'}
            </div>
          ) : null}

          <details className="rows">
            <summary>저장된 행 그대로 보기 (todos 테이블)</summary>
            {todos.length ? (
              <>
                <div className="tablewrap">
                  <table className="rowsview">
                    <thead>
                      <tr>
                        <th>id</th><th>done</th><th>priority</th><th>text</th><th>created_at</th><th>done_at</th>
                      </tr>
                    </thead>
                    <tbody>
                      {todos.map(t => (
                        <tr key={t.id}>
                          <td>{t.id}</td>
                          <td>{String(t.done)}</td>
                          <td>{t.priority}</td>
                          <td className="t">{t.text}</td>
                          <td>{t.created}</td>
                          <td>{t.doneAt || 'NULL'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="sqlnote mono">SELECT id, text, priority, done, created_at, done_at FROM todos ORDER BY created_at, id</div>
              </>
            ) : (
              <div className="sqlnote">아직 행이 없습니다.</div>
            )}
          </details>
        </div>
      </main>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
