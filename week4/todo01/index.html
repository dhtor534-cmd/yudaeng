<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>todo01 — 텍스트 파일에 쌓이는 투두</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" />
<style>
  /* 색·타이포는 수업 사이트(Comfy Classroom)의 디자인 언어를 따랐다.
     --bg #f6f8fc · --ink #17213c · 네이비 #182d69 · 프라이머리 #254bdb · radius 14px */
  :root {
    --bg: #f6f8fc; --ink: #17213c; --radius: 14px;
    --navy: #182d69; --navy-2: #101f4c;
    --brand: #254bdb; --brand-ink: #18349f; --brand-soft: #edf2ff; --brand-lift: #87a0ff;
    --panel: #ffffff; --panel-2: #fbfcfe;
    --line: #dce2ec; --line-soft: #e8ecf3;
    --dim: #52637e; --faint: #8992a3;
    --ok: #2f9e6b; --danger: #d94f4f;
    --shadow: 0 18px 44px -28px rgba(24,45,105,.42);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "DM Sans", "Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); }

  /* ---------- 2단 레이아웃 ---------- */
  .app { display: grid; grid-template-columns: minmax(0, 46fr) minmax(0, 54fr); min-height: 100vh; }

  /* 왼쪽 네이비 패널 */
  .side {
    background: var(--navy); color: #fff; padding: 34px 40px;
    display: flex; flex-direction: column; gap: 30px;
    position: sticky; top: 0; height: 100vh;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(140deg, #4465db, #254bdb); font-size: 16px; font-weight: 700; color: #fff;
  }
  .logo b { font-size: 19px; font-weight: 700; letter-spacing: -.2px; }
  .logo span { font-size: 19px; color: #a8b6e4; font-weight: 400; }

  .side .eyebrow { color: var(--brand-lift); }
  .side h1 { margin: 10px 0 0; font-size: 38px; line-height: 1.22; font-weight: 700; letter-spacing: -1px; }
  .side p.lead { margin: 16px 0 0; color: #c2cbe6; font-size: 14.5px; line-height: 1.75; }

  .steps { display: flex; flex-direction: column; gap: 14px; margin: 4px 0 0; padding: 0; list-style: none; }
  .steps li { display: flex; align-items: center; gap: 14px; font-size: 14px; color: #dbe2f4; }
  .steps .n {
    width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid rgba(135,160,255,.45); color: var(--brand-lift);
    font-size: 11.5px; font-weight: 600; font-family: "IBM Plex Mono", monospace;
  }
  .side .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; font-size: 12px; color: #8ca1d8; }
  .side .foot .path { font-family: "IBM Plex Mono", monospace; word-break: break-all; }

  /* 오른쪽 작업 영역 */
  .main { background: #fff; padding: 46px 52px 70px; min-width: 0; }
  .main .inner { max-width: 560px; }
  .main h2 { margin: 8px 0 6px; font-size: 27px; font-weight: 700; letter-spacing: -.6px; }
  .main .say { margin: 0 0 26px; color: var(--faint); font-size: 13.5px; }

  /* ---------- 입력 ---------- */
  form.add label.f { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 7px; }
  .row { display: flex; gap: 8px; }
  form.add input[type="text"] {
    flex: 1; min-width: 0; background: #fff; border: 1px solid var(--line);
    border-radius: 11px; padding: 13px 14px; outline: none; font-size: 14.5px; transition: .15s;
  }
  form.add input[type="text"]::placeholder { color: #b6bdcb; }
  form.add input[type="text"]:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,75,219,.12); }
  form.add select {
    border: 1px solid var(--line); border-radius: 11px; padding: 0 12px; background: #fff;
    outline: none; font-size: 13.5px; color: var(--dim);
  }
  form.add button.go {
    border: 0; border-radius: 11px; padding: 0 22px; background: var(--brand); color: #fff;
    font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; gap: 9px; white-space: nowrap;
    transition: .15s;
  }
  form.add button.go:hover:not(:disabled) { background: var(--brand-ink); }
  form.add button.go:disabled { background: #c3cbe0; cursor: not-allowed; }

  /* ---------- 필터 탭 (예시 사이트의 밑줄 탭) ---------- */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin: 30px 0 4px; }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    padding: 11px 18px; font-size: 14px; color: var(--faint); font-weight: 500; transition: .15s;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-pressed="true"] { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
  .tabs .right { margin-left: auto; display: flex; align-items: center; gap: 10px; padding-bottom: 6px; }
  .tabs .count { font-size: 12.5px; color: var(--faint); }
  .ghost {
    border: 1px solid var(--line); background: #fff; color: var(--dim);
    border-radius: 9px; padding: 5px 11px; font-size: 12.5px; transition: .15s;
  }
  .ghost:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .ghost:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- 목록 ---------- */
  ul.list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  li.item {
    display: flex; align-items: flex-start; gap: 13px;
    background: #fff; border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 14px 15px; box-shadow: 0 1px 2px rgba(24,45,105,.04); transition: .15s;
  }
  li.item:hover { border-color: var(--line); box-shadow: var(--shadow); }
  li.item.done { background: var(--panel-2); }
  li.item .check {
    width: 21px; height: 21px; flex: none; margin-top: 2px; border-radius: 7px;
    border: 1.5px solid #c3ccdd; background: #fff; display: grid; place-items: center;
    font-size: 12px; color: #fff; transition: .15s;
  }
  li.item .check:hover { border-color: var(--brand); }
  li.item.done .check { background: var(--brand); border-color: var(--brand); }
  li.item .body { flex: 1; min-width: 0; }
  li.item .text { font-size: 14.5px; word-break: break-word; cursor: text; }
  li.item.done .text { color: var(--faint); text-decoration: line-through; text-decoration-color: #c3ccdd; }
  li.item .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; font-size: 11.5px; color: var(--faint); font-family: "IBM Plex Mono", monospace; }
  li.item .meta .tag { border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; background: var(--panel-2); }
  .tag.p높음 { color: #c0392b; border-color: #f4d4d1; background: #fff5f4; }
  .tag.p보통 { color: var(--brand); border-color: #d7e0ff; background: var(--brand-soft); }
  .tag.p낮음 { color: var(--faint); }
  li.item .edit {
    width: 100%; background: #fff; border: 1px solid var(--brand);
    border-radius: 9px; padding: 8px 10px; outline: none; font-size: 14.5px;
    box-shadow: 0 0 0 3px rgba(37,75,219,.12);
  }
  li.item .x { border: 0; background: transparent; color: #b6bdcb; font-size: 15px; padding: 2px 5px; border-radius: 7px; flex: none; }
  li.item .x:hover { color: var(--danger); background: #fbeeed; }

  .empty { text-align: center; color: var(--faint); padding: 48px 20px; border: 1px dashed var(--line); border-radius: var(--radius); margin-top: 14px; font-size: 13.5px; }
  .empty .big { font-size: 28px; margin-bottom: 8px; }

  .banner { border-radius: 12px; padding: 13px 15px; font-size: 13px; line-height: 1.7; margin-bottom: 20px; }
  .banner.err { background: #fbeeed; border: 1px solid #f4d4d1; color: #9e3b32; }
  .banner code { font-family: "IBM Plex Mono", monospace; background: rgba(0,0,0,.05); padding: 1px 6px; border-radius: 5px; }

  .filebox { margin-top: 30px; border-top: 1px solid var(--line-soft); padding-top: 18px; }
  .filebox summary { cursor: pointer; font-size: 13px; color: var(--dim); list-style: none; display: flex; align-items: center; gap: 8px; }
  .filebox summary::-webkit-details-marker { display: none; }
  .filebox summary::before { content: "▸"; color: var(--faint); transition: transform .15s; }
  .filebox[open] summary::before { transform: rotate(90deg); }
  .filebox pre {
    margin: 12px 0 0; background: var(--navy); border-radius: 12px; padding: 16px;
    overflow-x: auto; font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
    color: #d5deF5; line-height: 1.85; tab-size: 12; white-space: pre;
  }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--navy); color: #fff; border-radius: 11px;
    padding: 10px 18px; font-size: 13px; box-shadow: 0 18px 40px -18px rgba(24,45,105,.7);
  }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; padding: 26px 22px 30px; gap: 20px; }
    .side h1 { font-size: 27px; }
    .side .steps, .side .foot { display: none; }
    .main { padding: 28px 22px 60px; }
    .main .inner { max-width: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* 모든 변경은 서버를 거치고, 서버가 돌려준 목록을 그대로 화면에 쓴다.
   = 화면과 txt 파일이 어긋날 일이 없다. */
async function api(path, options) {
  const res = await fetch('api/' + path, Object.assign({ cache: 'no-store' }, options, {
    headers: options && options.body ? { 'Content-Type': 'application/json' } : undefined
  }));
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) throw new Error((data && data.detail) || ('서버 오류 ' + res.status));
  return data;
}

function Item({ todo, onToggle, onEdit, onRemove, busy }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(todo.text);
  const ref = useRef(null);
  useEffect(() => { if (editing && ref.current) { ref.current.focus(); ref.current.select(); } }, [editing]);

  const commit = () => {
    const v = draft.trim();
    setEditing(false);
    if (v && v !== todo.text) onEdit(todo, v); else setDraft(todo.text);
  };
  return (
    <li className={'item' + (todo.done ? ' done' : '')}>
      <button className="check" onClick={() => onToggle(todo)} disabled={busy}
        aria-label={todo.done ? '완료 취소' : '완료로 표시'}>{todo.done ? '✔' : ''}</button>
      <div className="body">
        {editing ? (
          <input ref={ref} className="edit" value={draft}
            onChange={e => setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={e => {
              if (e.key === 'Enter') { e.preventDefault(); commit(); }
              if (e.key === 'Escape') { setDraft(todo.text); setEditing(false); }
            }} />
        ) : (
          <div className="text" onDoubleClick={() => setEditing(true)} title="더블클릭하면 고칠 수 있습니다">{todo.text}</div>
        )}
        <div className="meta">
          <span className={'tag p' + todo.priority}>{todo.priority}</span>
          <span>{todo.created}</span>
          {todo.done && todo.doneAt && <span>완료 {todo.doneAt}</span>}
          <span style={{ opacity: .65 }}>#{todo.id}</span>
        </div>
      </div>
      <button className="x" onClick={() => onRemove(todo)} disabled={busy} title="삭제">✕</button>
    </li>
  );
}

function App() {
  const [todos, setTodos] = useState([]);
  const [raw, setRaw] = useState('');
  const [info, setInfo] = useState({ fileName: 'data/todos.txt', priorities: ['높음', '보통', '낮음'] });
  const [text, setText] = useState('');
  const [priority, setPriority] = useState('보통');
  const [filter, setFilter] = useState('all');
  const [error, setError] = useState(null);
  const [ready, setReady] = useState(false);
  const [busy, setBusy] = useState(false);
  const [toast, setToast] = useState(null);

  const say = useCallback(msg => {
    setToast(msg);
    setTimeout(() => setToast(t => (t === msg ? null : t)), 2000);
  }, []);

  const apply = data => {
    setTodos(data.todos || []);
    setRaw(data.raw || '');
    if (data.fileName) setInfo({ fileName: data.fileName, priorities: data.priorities || info.priorities });
    setError(null);
  };
  const run = async (fn, okMsg) => {
    setBusy(true);
    try { apply(await fn()); if (okMsg) say(okMsg); }
    catch (e) { setError(e.message); }
    setBusy(false);
  };

  const reload = useCallback(async () => {
    try { apply(await api('todos')); }
    catch (e) { setError(e.message); }
    setReady(true);
  }, []);
  useEffect(() => { reload(); }, [reload]);

  const add = e => {
    e.preventDefault();
    const v = text.trim();
    if (!v || busy) return;
    setText('');
    run(() => api('todos', { method: 'POST', body: JSON.stringify({ text: v, priority }) }), '파일에 저장했습니다');
  };
  const toggle = t => run(() => api('todos/' + t.id, { method: 'PATCH', body: JSON.stringify({ done: !t.done }) }));
  const edit = (t, v) => run(() => api('todos/' + t.id, { method: 'PATCH', body: JSON.stringify({ text: v }) }), '수정했습니다');
  const remove = t => run(() => api('todos/' + t.id, { method: 'DELETE' }), '지웠습니다');
  const clearDone = () => run(() => api('todos/clear-done', { method: 'POST' }), '완료된 항목을 지웠습니다');

  const left = todos.filter(t => !t.done).length;
  const doneCount = todos.length - left;
  const shown = useMemo(() => (
    filter === 'todo' ? todos.filter(t => !t.done)
      : filter === 'done' ? todos.filter(t => t.done)
        : todos
  ), [todos, filter]);

  const offline = !!error && !todos.length;

  return (
    <div className="app">
      <aside className="side">
        <div className="logo">
          <div className="mark">✓</div>
          <b>todo</b><span>01</span>
        </div>

        <div>
          <div className="eyebrow">saved as plain text</div>
          <h1>적는 순간<br />파일에 남습니다.</h1>
          <p className="lead">
            할 일을 적으면 그대로 텍스트 파일 한 장에 기록됩니다.<br />
            메모장으로 열어봐도 되고, 거기서 바로 고쳐도 됩니다.
          </p>
        </div>

        <ul className="steps">
          <li><span className="n">01</span> 할 일 적기</li>
          <li><span className="n">02</span> {info.fileName} 에 한 줄로 기록</li>
          <li><span className="n">03</span> 메모장으로 열어 확인 · 수정</li>
        </ul>

        <div className="foot">
          <span className="path">{info.fileName}</span>
          <span>{ready && !error ? (left ? '남은 일 ' + left + '개' : todos.length ? '다 끝냈습니다' : '비어 있음') : ''}</span>
        </div>
      </aside>

      <main className="main">
        <div className="inner">
          <div className="eyebrow">오늘의 할 일</div>
          <h2>무엇부터 할까요?</h2>
          <p className="say">적고 엔터를 누르면 바로 저장됩니다.</p>

          {error && (
            <div className="banner err">
              ⚠ {error}
              {offline && (
                <>
                  <br />이 폴더에서 <code>node server.js</code> 를 실행하고 <code>http://localhost:8788</code> 로 접속하세요.
                  파일을 그냥 더블클릭해서 열면 저장할 서버가 없습니다.
                </>
              )}
              <br /><button className="ghost" style={{ marginTop: 9 }} onClick={reload}>다시 시도</button>
            </div>
          )}

          <form className="add" onSubmit={add}>
            <label className="f" htmlFor="newtodo">할 일</label>
            <div className="row">
              <input id="newtodo" type="text" value={text} onChange={e => setText(e.target.value)} maxLength={500}
                placeholder="예: 목요일까지 과제 제출" />
              <select value={priority} onChange={e => setPriority(e.target.value)} aria-label="우선순위">
                {info.priorities.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
              <button className="go" type="submit" disabled={!text.trim() || busy}>추가 <span>→</span></button>
            </div>
          </form>

          <div className="tabs">
            <button aria-pressed={filter === 'all'} onClick={() => setFilter('all')}>전체 {todos.length}</button>
            <button aria-pressed={filter === 'todo'} onClick={() => setFilter('todo')}>할 일 {left}</button>
            <button aria-pressed={filter === 'done'} onClick={() => setFilter('done')}>완료 {doneCount}</button>
            <div className="right">
              <span className="count">{ready ? '' : '불러오는 중…'}</span>
              <button className="ghost" onClick={clearDone} disabled={!doneCount || busy}>완료 지우기</button>
            </div>
          </div>

          {shown.length ? (
            <ul className="list">
              {shown.map(t => (
                <Item key={t.id} todo={t} busy={busy} onToggle={toggle} onEdit={edit} onRemove={remove} />
              ))}
            </ul>
          ) : ready && !error ? (
            <div className="empty">
              <div className="big">{filter === 'done' ? '🗂' : '📝'}</div>
              {filter === 'done' ? '완료한 일이 아직 없습니다.'
                : filter === 'todo' ? '할 일이 남아 있지 않습니다.'
                  : '첫 할 일을 적어보세요. 적는 순간 텍스트 파일에 기록됩니다.'}
            </div>
          ) : null}

          <details className="filebox">
            <summary>저장된 txt 파일 그대로 보기 ({info.fileName})</summary>
            <pre>{raw || '(아직 비어 있습니다)'}</pre>
          </details>
        </div>
      </main>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
