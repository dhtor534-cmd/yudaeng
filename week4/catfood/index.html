<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>하루한끼 캣푸드 — 연어 그레인프리 전연령 사료</title>
<meta name="description" content="휴먼그레이드 원료로 만든 그레인프리 고양이 사료. 연어·닭가슴살·오리 3가지 맛, 1kg/3kg/7kg." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
<style>
  :root {
    --cream: #FDF8F1; --paper: #FFFFFF; --soft: #FDEEE4;
    --ink: #2B2019; --dim: #7A6A5E; --faint: #A99A8D;
    --line: #EDE3D7; --line-soft: #F4ECE2;
    --brand: #E2703A; --brand-ink: #C4551F;
    --sage: #5C8A6B; --gold: #E8B84B; --danger: #C4453B;
    --r: 18px;
    --shadow: 0 20px 50px -32px rgba(74,48,30,.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: "Noto Sans KR", "DM Sans", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    line-height: 1.65; -webkit-font-smoothing: antialiased;
  }
  img, svg { display: block; max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  .num { font-family: "DM Sans", sans-serif; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brand); }
  h2.sec { font-size: 25px; font-weight: 700; letter-spacing: -.5px; margin: 8px 0 26px; }

  /* ---------- 헤더 ---------- */
  header.top {
    position: sticky; top: 0; z-index: 40; background: rgba(253,248,241,.92);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  }
  header.top .bar { display: flex; align-items: center; gap: 22px; height: 62px; }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -.3px; }
  .logo .m { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; }
  header.top nav { display: flex; gap: 20px; margin-left: 14px; }
  header.top nav a { text-decoration: none; font-size: 14px; color: var(--dim); }
  header.top nav a:hover { color: var(--ink); }
  header.top .cta {
    margin-left: auto; border: 0; background: var(--ink); color: #fff;
    border-radius: 999px; padding: 9px 18px; font-size: 13.5px; font-weight: 500;
  }
  header.top .cta:hover { background: #3f2f25; }

  /* ---------- 히어로 ---------- */
  .hero { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 46px; padding: 44px 0 56px; align-items: start; }
  .shot {
    background: linear-gradient(160deg, var(--soft), #fff 70%);
    border: 1px solid var(--line); border-radius: 24px; padding: 26px; box-shadow: var(--shadow);
  }
  .thumbs { display: flex; gap: 10px; margin-top: 14px; }
  .thumbs button {
    flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 13px; padding: 8px; transition: .15s;
  }
  .thumbs button[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(226,112,58,.14); }
  .thumbs .cap { font-size: 11.5px; color: var(--dim); margin-top: 5px; }

  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .badge { font-size: 11.5px; font-weight: 500; border-radius: 999px; padding: 3px 10px; background: var(--soft); color: var(--brand-ink); }
  .badge.sage { background: #EAF2EC; color: var(--sage); }
  h1.title { font-size: 31px; line-height: 1.32; font-weight: 700; letter-spacing: -.9px; margin: 0 0 8px; }
  .stars { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin-bottom: 18px; }
  .stars b { color: var(--gold); letter-spacing: 1px; }

  .price { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .price .off { font-size: 20px; font-weight: 700; color: var(--brand); }
  .price .now { font-size: 30px; font-weight: 700; letter-spacing: -1px; }
  .price .was { font-size: 15px; color: var(--faint); text-decoration: line-through; }
  .perkg { font-size: 12.5px; color: var(--faint); margin-bottom: 20px; }

  .opt { margin-bottom: 16px; }
  .opt .lab { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button {
    border: 1px solid var(--line); background: #fff; border-radius: 12px;
    padding: 9px 14px; font-size: 13.5px; color: var(--dim); transition: .15s; text-align: left;
  }
  .chips button:hover { border-color: #DCCBB8; color: var(--ink); }
  .chips button[aria-pressed="true"] { border-color: var(--brand); background: var(--soft); color: var(--brand-ink); font-weight: 500; }
  .chips .sub { display: block; font-size: 11.5px; opacity: .75; }

  .qty { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; width: fit-content; background: #fff; }
  .qty button { border: 0; background: transparent; width: 38px; height: 40px; font-size: 16px; color: var(--dim); }
  .qty button:hover { background: var(--soft); color: var(--brand-ink); }
  .qty span { width: 46px; text-align: center; font-weight: 500; }

  .total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 22px; padding-top: 16px; }
  .total .t { font-size: 13.5px; color: var(--dim); }
  .total .v { font-size: 26px; font-weight: 700; letter-spacing: -.8px; }
  .buy { display: flex; gap: 9px; margin-top: 16px; }
  .buy button { flex: 1; border-radius: 13px; padding: 14px; font-size: 15px; font-weight: 700; border: 1px solid var(--ink); transition: .15s; }
  .buy .cart { background: #fff; color: var(--ink); }
  .buy .cart:hover { background: #F6EDE3; }
  .buy .now2 { background: var(--brand); border-color: var(--brand); color: #fff; }
  .buy .now2:hover { background: var(--brand-ink); border-color: var(--brand-ink); }
  .ship { margin: 18px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--dim); display: flex; flex-direction: column; gap: 7px; }
  .ship li { display: flex; gap: 9px; }
  .ship .k { color: var(--faint); min-width: 62px; }

  /* ---------- 공통 섹션 ---------- */
  section { padding: 54px 0; border-top: 1px solid var(--line); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 20px;
  }
  .card .ico { width: 38px; height: 38px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; margin-bottom: 13px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
  .card p { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.7; }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  table.spec { width: 100%; border-collapse: collapse; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  table.spec caption { text-align: left; font-size: 13px; font-weight: 700; padding: 15px 18px 0; caption-side: top; }
  table.spec th, table.spec td { text-align: left; padding: 10px 18px; font-size: 13.5px; border-top: 1px solid var(--line-soft); }
  table.spec tr:first-child th, table.spec tr:first-child td { border-top: 0; }
  table.spec th { color: var(--dim); font-weight: 400; }
  table.spec td { text-align: right; font-weight: 500; font-family: "DM Sans", sans-serif; }
  table.spec thead th { background: var(--soft); color: var(--brand-ink); font-weight: 700; font-size: 12.5px; }
  table.spec thead td { background: var(--soft); }

  .reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .review { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
  .review .top { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .review .av { width: 32px; height: 32px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 15px; }
  .review .who { font-size: 13px; font-weight: 500; }
  .review .when { font-size: 11.5px; color: var(--faint); }
  .review .st { color: var(--gold); font-size: 12px; letter-spacing: 1px; }
  .review p { margin: 0; font-size: 13.5px; color: var(--dim); line-height: 1.75; }

  /* ---------- 문의 폼 ---------- */
  .ask { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 34px; align-items: start; }
  .asklead p { color: var(--dim); font-size: 14px; line-height: 1.8; margin: 0 0 18px; }
  .recent { border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); padding: 16px 18px; }
  .recent h4 { margin: 0 0 12px; font-size: 12.5px; font-weight: 700; color: var(--dim); }
  .recent ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .recent li { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--dim); }
  .recent .who { font-weight: 500; color: var(--ink); }
  .recent .st { margin-left: auto; font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
  .recent .st.접수 { color: var(--brand-ink); background: var(--soft); border-color: transparent; }
  .recent .st.처리중 { color: var(--sage); background: #EAF2EC; border-color: transparent; }
  .recent .st.답변완료 { color: var(--dim); }
  .recent .none { font-size: 12.5px; color: var(--faint); }

  form.inq { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 26px; box-shadow: var(--shadow); }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 7px; }
  .field label span.req { color: var(--brand); margin-left: 3px; }
  .field input, .field select, .field textarea {
    width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 13px; outline: none; font-size: 14px; transition: .15s;
  }
  .field textarea { resize: vertical; min-height: 130px; line-height: 1.7; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(226,112,58,.13); }
  .field input::placeholder, .field textarea::placeholder { color: #C9BBAC; }
  .field.bad input, .field.bad select, .field.bad textarea { border-color: var(--danger); background: #FDF4F3; }
  .err { font-size: 12px; color: var(--danger); margin-top: 6px; }
  .hint { font-size: 12px; color: var(--faint); margin-top: 6px; }
  .agree { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--dim); margin: 4px 0 18px; }
  .agree input { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--brand); flex: none; }
  .submit {
    width: 100%; border: 0; border-radius: 13px; padding: 15px; background: var(--brand); color: #fff;
    font-size: 15px; font-weight: 700; transition: .15s;
  }
  .submit:hover:not(:disabled) { background: var(--brand-ink); }
  .submit:disabled { background: #E6D7C8; color: #fff; cursor: not-allowed; }

  .note { border-radius: 13px; padding: 13px 15px; font-size: 13px; line-height: 1.7; margin-bottom: 18px; }
  .note.warn { background: #FDF3E8; border: 1px solid #F1DCC2; color: #8A5A22; }
  .note.err { background: #FDF0EF; border: 1px solid #F2D4D1; color: #9A3B32; }
  .note code { font-family: "DM Sans", monospace; background: rgba(0,0,0,.05); padding: 1px 6px; border-radius: 5px; }

  .done { text-align: center; padding: 34px 22px; }
  .done .tick { width: 56px; height: 56px; border-radius: 50%; background: #EAF2EC; color: var(--sage); display: grid; place-items: center; font-size: 26px; margin: 0 auto 16px; }
  .done h3 { margin: 0 0 6px; font-size: 19px; }
  .done p { margin: 0 0 18px; font-size: 13.5px; color: var(--dim); line-height: 1.75; }
  .ticket {
    display: inline-block; font-family: "DM Sans", monospace; font-size: 17px; font-weight: 700; letter-spacing: .5px;
    background: var(--soft); color: var(--brand-ink); border-radius: 12px; padding: 11px 20px; margin-bottom: 20px;
  }
  .again { border: 1px solid var(--line); background: #fff; border-radius: 11px; padding: 9px 18px; font-size: 13.5px; color: var(--dim); }
  .again:hover { border-color: var(--brand); color: var(--brand-ink); }

  footer { border-top: 1px solid var(--line); padding: 30px 0 46px; font-size: 12.5px; color: var(--faint); }
  footer .row { display: flex; gap: 18px; flex-wrap: wrap; }
  footer .row span { }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 90;
    background: var(--ink); color: #fff; border-radius: 12px; padding: 11px 20px; font-size: 13.5px;
    box-shadow: 0 18px 40px -18px rgba(43,32,25,.7);
  }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; gap: 28px; padding: 26px 0 36px; }
    .cards { grid-template-columns: 1fr 1fr; }
    .two, .reviews, .ask, .frow { grid-template-columns: 1fr; }
    header.top nav { display: none; }
    h1.title { font-size: 25px; }
    .wrap { padding: 0 16px; }
    section { padding: 38px 0; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------- 상품 데이터 (페이지 안의 고정 값) ---------- */
const FLAVORS = [
  { id: 'salmon', name: '연어', sub: '스코틀랜드산 연어 62%', bag: ['#F5A97F', '#E2703A'], tone: '#FBE7DA', accent: '#C4551F' },
  { id: 'chicken', name: '닭가슴살', sub: '국내산 생닭가슴살 65%', bag: ['#F2CE86', '#D9A63F'], tone: '#FBF1DC', accent: '#A9761B' },
  { id: 'duck', name: '오리&고구마', sub: '오리고기 58% · 고구마', bag: ['#C8AEDC', '#8F6FB5'], tone: '#F1EAF7', accent: '#6B4F8F' }
];
const SIZES = [
  { id: '1kg', label: '1kg', sub: '체험용', price: 18900, was: 23000 },
  { id: '3kg', label: '3kg', sub: '가장 많이 삼', price: 48900, was: 62000 },
  { id: '7kg', label: '7kg', sub: '다묘 가정', price: 99000, was: 128000 }
];
const NUTRITION = [
  ['조단백질', '36% 이상'], ['조지방', '16% 이상'], ['조섬유', '3% 이하'],
  ['조회분', '8% 이하'], ['수분', '8% 이하'], ['칼슘 / 인', '1.2% / 1.0%'], ['타우린', '0.2% 이상']
];
const FEEDING = [
  ['2kg', '30g'], ['3kg', '40g'], ['4kg', '50g'], ['5kg', '60g'], ['6kg 이상', '70g']
];
const POINTS = [
  { ico: '🌾', t: '그레인프리', d: '밀·옥수수·글루텐을 넣지 않아 곡물에 예민한 아이도 부담이 적습니다.' },
  { ico: '🥩', t: '휴먼그레이드', d: '사람이 먹는 등급의 원료만 씁니다. 부산물·육분은 넣지 않습니다.' },
  { ico: '🪥', t: '헤어볼 케어', d: '차전자피와 식이섬유로 삼킨 털이 자연스럽게 배출되도록 돕습니다.' },
  { ico: '🏭', t: '국내 HACCP', d: '전남 화순 자사 공장에서 소량 생산하고 생산일자를 봉투에 찍습니다.' }
];
const REVIEWS = [
  { who: '김*연', when: '3일 전', st: 5, txt: '입 짧은 코숏이 처음으로 그릇을 비웠어요. 알갱이가 작아서 노묘도 잘 먹습니다.' },
  { who: '이*훈', when: '1주 전', st: 5, txt: '3kg 두 봉 째입니다. 화장실 냄새가 확실히 줄었어요. 지퍼백이라 보관도 편해요.' },
  { who: '박*지', when: '2주 전', st: 4, txt: '털 빠짐이 줄어든 느낌. 배송이 하루 만에 와서 놀랐습니다. 가격만 조금 더 착하면 좋겠어요.' }
];
const won = (n) => n.toLocaleString('ko-KR') + '원';

/* ---------- 상품 이미지 (그림 파일 없이 SVG 로 그린다) ---------- */
function Pouch({ flavor, size }) {
  const f = flavor;
  return (
    <svg viewBox="0 0 320 360" role="img" aria-label={'하루한끼 ' + f.name + ' ' + size.label + ' 사료 봉투'} style={{ width: '100%', height: 'auto' }}>
      <defs>
        <linearGradient id={'bag' + f.id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={f.bag[0]} />
          <stop offset="100%" stopColor={f.bag[1]} />
        </linearGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#fff" stopOpacity=".28" />
          <stop offset="45%" stopColor="#fff" stopOpacity="0" />
        </linearGradient>
      </defs>

      {/* 그림자 */}
      <ellipse cx="160" cy="336" rx="96" ry="12" fill="#B99B84" opacity=".28" />

      {/* 봉투 몸통 */}
      <path d="M62 66 q98 -14 196 0 l14 236 q-108 18 -224 0 z" fill={'url(#bag' + f.id + ')'} />
      <path d="M62 66 q98 -14 196 0 l14 236 q-108 18 -224 0 z" fill="url(#sheen)" />

      {/* 상단 실링 */}
      <path d="M58 44 q102 -16 204 0 l-4 24 q-98 -14 -196 0 z" fill={f.bag[1]} opacity=".9" />
      <g fill="#fff" opacity=".45">
        {[0,1,2,3,4,5,6,7,8].map(i => <rect key={i} x={72 + i * 20} y="48" width="9" height="14" rx="2" />)}
      </g>

      {/* 라벨 */}
      <rect x="86" y="118" width="148" height="150" rx="16" fill="#FFFDF9" opacity=".95" />

      {/* 고양이 얼굴 */}
      <g transform="translate(160,168)">
        <path d="M-34 -8 l-6 -26 l24 12 z" fill={f.accent} />
        <path d="M34 -8 l6 -26 l-24 12 z" fill={f.accent} />
        <circle cx="0" cy="2" r="30" fill={f.accent} />
        <circle cx="-11" cy="-4" r="3.6" fill="#FFFDF9" />
        <circle cx="11" cy="-4" r="3.6" fill="#FFFDF9" />
        <path d="M-5 7 q5 5 10 0" stroke="#FFFDF9" strokeWidth="2.4" fill="none" strokeLinecap="round" />
        <g stroke="#FFFDF9" strokeWidth="1.6" opacity=".8" strokeLinecap="round">
          <path d="M-20 4 h-14" /><path d="M-20 10 h-13" /><path d="M20 4 h14" /><path d="M20 10 h13" />
        </g>
      </g>

      <text x="160" y="222" textAnchor="middle" fontFamily="Noto Sans KR, sans-serif" fontSize="17" fontWeight="700" fill="#2B2019">하루한끼</text>
      <text x="160" y="243" textAnchor="middle" fontFamily="Noto Sans KR, sans-serif" fontSize="12" fill="#7A6A5E">{f.name} · 전연령</text>

      {/* 그레인프리 리본 */}
      <rect x="104" y="252" width="112" height="22" rx="11" fill={f.accent} opacity=".14" />
      <text x="160" y="267" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="10.5" fontWeight="700" letterSpacing="1.6" fill={f.accent}>GRAIN FREE</text>

      {/* 중량 스티커 */}
      <circle cx="243" cy="112" r="29" fill="#FFFDF9" stroke={f.accent} strokeWidth="1.6" />
      <text x="243" y="110" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="16" fontWeight="700" fill={f.accent}>{size.label}</text>
      <text x="243" y="123" textAnchor="middle" fontFamily="Noto Sans KR, sans-serif" fontSize="8.5" fill="#7A6A5E">NET WT</text>
    </svg>
  );
}
function MiniPouch({ flavor }) {
  return (
    <svg viewBox="0 0 60 70" style={{ width: '100%', height: 'auto' }} aria-hidden="true">
      <defs>
        <linearGradient id={'m' + flavor.id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={flavor.bag[0]} /><stop offset="100%" stopColor={flavor.bag[1]} />
        </linearGradient>
      </defs>
      <path d="M12 14 q18 -3 36 0 l3 46 q-21 4 -42 0 z" fill={'url(#m' + flavor.id + ')'} />
      <path d="M11 8 q19 -3 38 0 l-1 6 q-18 -3 -36 0 z" fill={flavor.bag[1]} />
      <circle cx="30" cy="36" r="9" fill="#FFFDF9" opacity=".92" />
      <circle cx="30" cy="36" r="5.5" fill={flavor.accent} />
    </svg>
  );
}

/* ---------- 문의 폼 ---------- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function InquiryForm({ topics, optionLabel, dbOff, onSent }) {
  const [form, setForm] = useState({ name: '', email: '', phone: '', topic: topics[0] || '상품 문의', message: '', agreed: false });
  const [errors, setErrors] = useState({});
  const [serverMsg, setServerMsg] = useState(null);
  const [sending, setSending] = useState(false);

  useEffect(() => { setForm(f => (topics.includes(f.topic) ? f : Object.assign({}, f, { topic: topics[0] }))); }, [topics.join()]);

  const set = (k, v) => {
    setForm(f => Object.assign({}, f, { [k]: v }));
    setErrors(e => { if (!e[k]) return e; const n = Object.assign({}, e); delete n[k]; return n; });
  };

  const localCheck = () => {
    const e = {};
    if (!form.name.trim()) e.name = '이름을 적어주세요.';
    if (!EMAIL_RE.test(form.email.trim())) e.email = '이메일 형식이 올바르지 않습니다.';
    if (form.phone.trim() && !/^[0-9+\-() ]{7,30}$/.test(form.phone.trim())) e.phone = '숫자와 - ( ) + 만 쓸 수 있습니다.';
    if (form.message.trim().length < 5) e.message = '문의 내용을 5자 이상 적어주세요.';
    if (!form.agreed) e.agreed = '개인정보 수집·이용에 동의해주세요.';
    return e;
  };

  const submit = async (ev) => {
    ev.preventDefault();
    setServerMsg(null);
    const e = localCheck();
    setErrors(e);
    if (Object.keys(e).length) return;

    setSending(true);
    try {
      const res = await fetch('api/inquiries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({}, form, { option: optionLabel }))
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (data.errors) setErrors(data.errors);
        setServerMsg(data.detail || ('접수에 실패했습니다 (' + res.status + ')'));
        setSending(false);
        return;
      }
      onSent(data);
    } catch (err) {
      setServerMsg('서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.');
    }
    setSending(false);
  };

  const F = (k, label, extra) => (
    <div className={'field' + (errors[k] ? ' bad' : '')}>
      <label htmlFor={'f-' + k}>{label}{extra && extra.req && <span className="req">*</span>}</label>
      {extra && extra.node}
      {errors[k] && <div className="err">{errors[k]}</div>}
      {!errors[k] && extra && extra.hint && <div className="hint">{extra.hint}</div>}
    </div>
  );

  return (
    <form className="inq" onSubmit={submit} noValidate>
      {dbOff && (
        <div className="note warn">
          ⚠ 지금은 문의 저장이 꺼져 있습니다 — 서버에 <code>DATABASE_URL</code> 이 설정되지 않았습니다.
          폼은 그대로 쓸 수 있고, 연결되면 바로 접수됩니다.
        </div>
      )}
      {serverMsg && <div className="note err">⚠ {serverMsg}</div>}

      <div className="frow">
        {F('name', '이름', { req: true, node: (
          <input id="f-name" type="text" value={form.name} maxLength={50}
            onChange={e => set('name', e.target.value)} placeholder="홍길동" />
        )})}
        {F('email', '이메일', { req: true, hint: '답변은 이 주소로 보내드립니다.', node: (
          <input id="f-email" type="email" value={form.email} maxLength={120}
            onChange={e => set('email', e.target.value)} placeholder="you@example.com" />
        )})}
      </div>

      <div className="frow">
        {F('phone', '연락처', { hint: '선택 입력', node: (
          <input id="f-phone" type="tel" value={form.phone} maxLength={30}
            onChange={e => set('phone', e.target.value)} placeholder="010-0000-0000" />
        )})}
        {F('topic', '문의 유형', { req: true, node: (
          <select id="f-topic" value={form.topic} onChange={e => set('topic', e.target.value)}>
            {topics.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        )})}
      </div>

      {F('message', '문의 내용', { req: true, hint: '지금 보고 계신 옵션(' + optionLabel + ')이 함께 전달됩니다.', node: (
        <textarea id="f-message" value={form.message} maxLength={2000}
          onChange={e => set('message', e.target.value)}
          placeholder="예) 7개월 된 코숏인데 1kg부터 시작해도 될까요? 기존 사료와 섞어 급여하는 방법도 알려주세요." />
      )})}

      <div className="agree">
        <input id="f-agree" type="checkbox" checked={form.agreed} onChange={e => set('agreed', e.target.checked)} />
        <label htmlFor="f-agree" style={{ margin: 0, fontWeight: 400, fontSize: 13 }}>
          답변을 위한 <b>이름 · 이메일 · 연락처</b> 수집에 동의합니다. 문의 처리 후 1년간 보관하고 파기합니다.
          {errors.agreed && <div className="err">{errors.agreed}</div>}
        </label>
      </div>

      <button className="submit" type="submit" disabled={sending}>
        {sending ? '접수하는 중…' : '문의 보내기'}
      </button>
    </form>
  );
}

/* ---------- 페이지 ---------- */
function App() {
  const [flavorId, setFlavorId] = useState('salmon');
  const [sizeId, setSizeId] = useState('3kg');
  const [qty, setQty] = useState(1);
  const [health, setHealth] = useState(null);
  const [recent, setRecent] = useState([]);
  const [sent, setSent] = useState(null);
  const [toast, setToast] = useState(null);
  const askRef = useRef(null);

  const flavor = FLAVORS.find(f => f.id === flavorId);
  const size = SIZES.find(s => s.id === sizeId);
  const optionLabel = flavor.name + ' / ' + size.label;
  const total = size.price * qty;
  const rate = Math.round((1 - size.price / size.was) * 100);

  const say = useCallback(msg => {
    setToast(msg);
    setTimeout(() => setToast(t => (t === msg ? null : t)), 2200);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const h = await (await fetch('api/health', { cache: 'no-store' })).json();
        setHealth(h);
        if (h.connected) {
          const r = await (await fetch('api/inquiries?recent=1', { cache: 'no-store' })).json();
          setRecent(r.recent || []);
        }
      } catch (e) { setHealth({ connected: false, detail: '서버에 연결할 수 없습니다.' }); }
    })();
  }, []);

  const topics = (health && health.topics) || ['상품 문의', '배송 문의', '교환·환불', '대량 구매', '기타'];
  const dbOff = !!health && !health.connected;
  const goAsk = () => askRef.current && askRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });

  const onSent = data => {
    setSent(data);
    if (data.recent) setRecent(data.recent);
    say('문의가 접수되었습니다');
    setTimeout(goAsk, 50);
  };

  return (
    <>
      <header className="top">
        <div className="wrap bar">
          <div className="logo">
            <span className="m">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9 L2.5 3.5 L8 6.5 Z M20 9 L21.5 3.5 L16 6.5 Z" fill="#fff" />
                <circle cx="12" cy="13.5" r="7.5" fill="#fff" />
                <circle cx="9.4" cy="12.4" r="1.1" fill="#E2703A" />
                <circle cx="14.6" cy="12.4" r="1.1" fill="#E2703A" />
                <path d="M10.7 15.4 q1.3 1.2 2.6 0" stroke="#E2703A" strokeWidth="1.1" fill="none" strokeLinecap="round" />
              </svg>
            </span>
            하루한끼
          </div>
          <nav>
            <a href="#point">특징</a>
            <a href="#spec">성분·급여량</a>
            <a href="#review">후기</a>
            <a href="#ask">문의</a>
          </nav>
          <button className="cta" onClick={goAsk}>문의하기</button>
        </div>
      </header>

      <main className="wrap">
        {/* 히어로 */}
        <div className="hero">
          <div>
            <div className="shot" style={{ background: 'linear-gradient(160deg, ' + flavor.tone + ', #fff 72%)' }}>
              <Pouch flavor={flavor} size={size} />
            </div>
            <div className="thumbs">
              {FLAVORS.map(f => (
                <button key={f.id} aria-pressed={f.id === flavorId} onClick={() => setFlavorId(f.id)} title={f.sub}>
                  <MiniPouch flavor={f} />
                  <div className="cap">{f.name}</div>
                </button>
              ))}
            </div>
          </div>

          <div>
            <div className="badges">
              <span className="badge">그레인프리</span>
              <span className="badge sage">전연령용</span>
              <span className="badge sage">국내생산</span>
            </div>
            <h1 className="title">하루한끼 {flavor.name}<br />전연령 고양이 사료</h1>
            <div className="stars">
              <b>★★★★★</b> 4.9
              <span>· 후기 1,284개</span>
              <span>· 재구매율 78%</span>
            </div>

            <div className="price">
              <span className="off num">{rate}%</span>
              <span className="now num">{won(size.price)}</span>
              <span className="was num">{won(size.was)}</span>
            </div>
            <div className="perkg num">100g당 {won(Math.round(size.price / (parseFloat(size.label) * 10)))} · {flavor.sub}</div>

            <div className="opt">
              <div className="lab">맛</div>
              <div className="chips">
                {FLAVORS.map(f => (
                  <button key={f.id} aria-pressed={f.id === flavorId} onClick={() => setFlavorId(f.id)}>
                    {f.name}<span className="sub">{f.sub}</span>
                  </button>
                ))}
              </div>
            </div>

            <div className="opt">
              <div className="lab">용량</div>
              <div className="chips">
                {SIZES.map(s => (
                  <button key={s.id} aria-pressed={s.id === sizeId} onClick={() => setSizeId(s.id)}>
                    {s.label}<span className="sub">{s.sub} · {won(s.price)}</span>
                  </button>
                ))}
              </div>
            </div>

            <div className="opt">
              <div className="lab">수량</div>
              <div className="qty">
                <button onClick={() => setQty(q => Math.max(1, q - 1))} aria-label="수량 줄이기">−</button>
                <span className="num">{qty}</span>
                <button onClick={() => setQty(q => Math.min(10, q + 1))} aria-label="수량 늘리기">+</button>
              </div>
            </div>

            <div className="total">
              <span className="t">총 결제금액</span>
              <span className="v num">{won(total)}</span>
            </div>

            <div className="buy">
              <button className="cart" onClick={() => say(optionLabel + ' ' + qty + '개를 장바구니에 담았습니다 (데모)')}>장바구니</button>
              <button className="now2" onClick={() => say('데모 페이지라 결제는 연결되어 있지 않습니다')}>바로 구매</button>
            </div>

            <ul className="ship">
              <li><span className="k">배송</span> 3만원 이상 무료 · 오후 2시 이전 주문 시 당일 출고</li>
              <li><span className="k">유통기한</span> 제조일로부터 18개월 · 봉투에 생산일자 인쇄</li>
              <li><span className="k">교환·환불</span> 미개봉 7일 이내 무료 · 기호성 불만족 시 1회 전액 환불</li>
            </ul>
          </div>
        </div>

        {/* 특징 */}
        <section id="point">
          <div className="eyebrow">why 하루한끼</div>
          <h2 className="sec">까다로운 아이도 그릇을 비우는 이유</h2>
          <div className="cards">
            {POINTS.map(p => (
              <div className="card" key={p.t}>
                <div className="ico">{p.ico}</div>
                <h3>{p.t}</h3>
                <p>{p.d}</p>
              </div>
            ))}
          </div>
        </section>

        {/* 성분 · 급여량 */}
        <section id="spec">
          <div className="eyebrow">nutrition</div>
          <h2 className="sec">성분과 하루 급여량</h2>
          <div className="two">
            <table className="spec">
              <caption>보장성분 (건물기준)</caption>
              <tbody>
                {NUTRITION.map(([k, v]) => (
                  <tr key={k}><th scope="row">{k}</th><td>{v}</td></tr>
                ))}
              </tbody>
            </table>
            <table className="spec">
              <caption>하루 급여량 (성묘 기준)</caption>
              <thead><tr><th>체중</th><td style={{ textAlign: 'right', fontWeight: 700, fontSize: '12.5px' }}>하루 급여량</td></tr></thead>
              <tbody>
                {FEEDING.map(([k, v]) => (
                  <tr key={k}><th scope="row">{k}</th><td>{v}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
          <p style={{ fontSize: 12.5, color: 'var(--faint)', marginTop: 14 }}>
            기존 사료에서 바꿀 때는 7일에 걸쳐 조금씩 섞는 비율을 늘려주세요. 임신·수유묘는 1.5~2배, 자묘는 자유 급여를 권장합니다.
          </p>
        </section>

        {/* 후기 */}
        <section id="review">
          <div className="eyebrow">reviews</div>
          <h2 className="sec">먼저 먹여본 집사님들</h2>
          <div className="reviews">
            {REVIEWS.map(r => (
              <div className="review" key={r.who}>
                <div className="top">
                  <div className="av">🐈</div>
                  <div>
                    <div className="who">{r.who}</div>
                    <div className="when">{r.when}</div>
                  </div>
                </div>
                <div className="st">{'★'.repeat(r.st)}{'☆'.repeat(5 - r.st)}</div>
                <p>{r.txt}</p>
              </div>
            ))}
          </div>
        </section>

        {/* 문의 */}
        <section id="ask" ref={askRef}>
          <div className="eyebrow">contact</div>
          <h2 className="sec">문의하기</h2>
          <div className="ask">
            <div className="asklead">
              <p>
                사료 급여량, 알레르기, 대량 구매까지 무엇이든 물어보세요.<br />
                영업일 기준 <b>1일 이내</b>에 적어주신 이메일로 답변드립니다.
              </p>
              <div className="recent">
                <h4>최근 문의 {health && health.stats ? '· 누적 ' + health.stats.total + '건' : ''}</h4>
                {recent.length ? (
                  <ul>
                    {recent.map(r => (
                      <li key={r.ticket}>
                        <span className="who">{r.name}</span>
                        <span>{r.topic}</span>
                        <span className={'st ' + r.status}>{r.status}</span>
                      </li>
                    ))}
                  </ul>
                ) : (
                  <div className="none">
                    {dbOff ? 'DB 가 연결되면 최근 문의가 여기 표시됩니다.' : '아직 접수된 문의가 없습니다. 첫 문의를 남겨보세요.'}
                  </div>
                )}
                <div style={{ fontSize: 11.5, color: 'var(--faint)', marginTop: 12, lineHeight: 1.6 }}>
                  이름과 이메일은 일부만 표시됩니다. 문의 내용은 공개되지 않습니다.
                </div>
              </div>
            </div>

            {sent ? (
              <div className="inq done">
                <div className="tick">✓</div>
                <h3>문의가 접수되었습니다</h3>
                <p>
                  접수번호를 적어두세요. 답변은 입력하신 이메일로 보내드립니다.<br />
                  <b>{sent.topic}</b> · {sent.created}
                </p>
                <div className="ticket">{sent.ticket}</div>
                <div>
                  <button className="again" onClick={() => setSent(null)}>문의 하나 더 남기기</button>
                </div>
              </div>
            ) : (
              <InquiryForm topics={topics} optionLabel={optionLabel} dbOff={dbOff} onSent={onSent} />
            )}
          </div>
        </section>
      </main>

      <footer>
        <div className="wrap">
          <div className="row">
            <span>하루한끼 (주)</span>
            <span>대표 김하루</span>
            <span>사업자등록번호 000-00-00000</span>
            <span>전남 화순군 능주면 00로 12</span>
          </div>
          <div className="row" style={{ marginTop: 8 }}>
            <span>고객센터 1588-0000 (평일 10:00–17:00)</span>
            <span>help@haruhankki.example</span>
          </div>
          <div style={{ marginTop: 14, opacity: .8 }}>
            수업 실습용 데모 페이지입니다. 실제 판매·결제는 이루어지지 않습니다.
          </div>
        </div>
      </footer>

      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
