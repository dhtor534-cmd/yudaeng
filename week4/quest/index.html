<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>냉장고 파먹기 — 재료 &amp; 레시피 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
<style>
  :root {
    --bg: #f6f8fc; --ink: #17213c; --navy: #182d69;
    --brand: #254bdb; --brand-ink: #18349f; --brand-soft: #edf2ff;
    --paper: #fff; --line: #dce2ec; --line-soft: #e8ecf3;
    --dim: #52637e; --faint: #8992a3;
    --ok: #2f9e6b; --ok-soft: #e8f7f0;
    --warn: #b87b1f; --warn-soft: #fdf3e0;
    --bad: #d2453c; --bad-soft: #fdecea;
    --r: 16px; --r-sm: 10px;
    --shadow: 0 18px 44px -30px rgba(24,45,105,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "DM Sans", "Noto Sans KR", system-ui, -apple-system, sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 40px 16px 90px; }

  /* ---------- header ---------- */
  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--brand); }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -1px; margin: 9px 0 8px; }
  .lead { color: var(--dim); font-size: 14px; margin: 0 0 26px; }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
  .stat {
    background: var(--paper); border: 1px solid var(--line-soft); border-radius: var(--r);
    padding: 14px 16px;
  }
  .stat .k { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--faint); text-transform: uppercase; }
  .stat .v { font-size: 26px; font-weight: 700; letter-spacing: -.5px; line-height: 1.2; margin-top: 4px; }
  .stat .v small { font-size: 13px; font-weight: 500; color: var(--faint); margin-left: 2px; }
  .stat.is-warn .v { color: var(--warn); }
  .stat.is-bad .v { color: var(--bad); }
  .stat.is-ok .v { color: var(--ok); }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 6px; background: var(--paper); border: 1px solid var(--line-soft);
          border-radius: 999px; padding: 5px; margin-bottom: 18px; width: fit-content; max-width: 100%; overflow-x: auto; }
  .tabs button {
    border: 0; background: transparent; padding: 8px 18px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; color: var(--dim); cursor: pointer; white-space: nowrap; transition: .15s;
  }
  .tabs button:hover { color: var(--brand); }
  .tabs button[aria-selected="true"] { background: var(--brand); color: #fff; }
  .tabs .count { font-size: 11px; opacity: .75; margin-left: 5px; }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .field {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 8px 12px; font-size: 13.5px; outline: none; transition: .15s; min-width: 0;
  }
  .field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .search { flex: 1 1 200px; }
  .btn {
    border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-sm);
    padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand-ink); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-ink); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--dim); }
  .btn.ghost:hover { background: var(--brand-soft); color: var(--brand-ink); }
  .btn.danger { color: var(--bad); }
  .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); color: inherit; }

  /* ---------- chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip {
    border: 1px solid var(--line); background: var(--paper); border-radius: 999px;
    padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--dim); cursor: pointer; transition: .15s;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand-ink); }
  .chip[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); }

  /* ---------- 상태 배너 / 로딩 ---------- */
  .banner { display: flex; gap: 10px; align-items: flex-start; border: 1px solid;
            border-radius: var(--r); padding: 13px 16px; font-size: 13px; margin-bottom: 16px; line-height: 1.7; }
  .banner.bad  { background: var(--bad-soft); border-color: #f2c8c4; color: #8d2b25; }
  .banner.info { background: var(--brand-soft); border-color: #cbd8fb; color: var(--brand-ink); }
  .banner code { font-family: "IBM Plex Mono", monospace; font-size: 12px;
                 background: rgba(255,255,255,.7); padding: 1px 6px; border-radius: 5px; }
  .banner .btn { margin-left: auto; flex: none; }

  .loading { display: grid; place-items: center; gap: 13px; padding: 90px 20px; color: var(--faint); font-size: 13.5px; }
  .spin { width: 26px; height: 26px; border-radius: 999px;
          border: 3px solid var(--line); border-top-color: var(--brand); animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .dim-while-busy { transition: opacity .15s; }
  .dim-while-busy.busy { opacity: .55; pointer-events: none; }

  /* ---------- cards ---------- */
  .grid { display: grid; gap: 12px; }
  .grid.g3 { grid-template-columns: repeat(3, 1fr); }
  .grid.g2 { grid-template-columns: repeat(2, 1fr); }
  .grid.g1 { grid-template-columns: 1fr; }
  .card {
    background: var(--paper); border: 1px solid var(--line-soft); border-radius: var(--r);
    padding: 16px 18px; transition: .16s;
  }
  .card:hover { box-shadow: var(--shadow); border-color: var(--line); }
  .card.clickable { cursor: pointer; }

  .ing-top { display: flex; align-items: flex-start; gap: 10px; }
  .ing-emoji {
    width: 40px; height: 40px; border-radius: 12px; background: var(--brand-soft);
    display: grid; place-items: center; font-size: 20px; flex: none;
  }
  .ing-name { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
  .ing-meta { font-size: 12px; color: var(--faint); margin-top: 1px; }
  .ing-qty { margin-left: auto; text-align: right; flex: none; }
  .ing-qty b { font-size: 17px; font-weight: 700; }
  .ing-qty span { font-size: 11.5px; color: var(--faint); margin-left: 1px; }

  .ing-bottom { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding-top: 11px; border-top: 1px dashed var(--line-soft); }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 999px;
    padding: 3px 9px; font-size: 11.5px; font-weight: 700; letter-spacing: -.1px;
  }
  .badge.fresh { background: var(--ok-soft); color: var(--ok); }
  .badge.soon  { background: #eef2fb; color: var(--dim); }
  .badge.urgent{ background: var(--warn-soft); color: var(--warn); }
  .badge.expired { background: var(--bad-soft); color: var(--bad); }
  .badge.neutral { background: #eef1f6; color: var(--dim); }

  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .stepper button { border: 0; background: transparent; width: 27px; height: 26px; cursor: pointer; color: var(--dim); font-weight: 700; line-height: 1; }
  .stepper button:hover { background: var(--brand-soft); color: var(--brand-ink); }

  /* ---------- recipe ---------- */
  .rc-head { display: flex; align-items: flex-start; gap: 11px; }
  .rc-emoji { font-size: 25px; width: 44px; height: 44px; border-radius: 13px; background: #f2f5fb; display: grid; place-items: center; flex: none; }
  .rc-title { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
  .rc-desc { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
  .rc-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
  .tag { font-size: 11px; font-weight: 600; color: var(--faint); background: #f2f5fb; border-radius: 6px; padding: 2px 7px; }

  .bar { height: 6px; border-radius: 999px; background: #eceff5; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--brand); transition: width .3s; }
  .bar.full > i { background: var(--ok); }
  .rc-ratio { display: flex; justify-content: space-between; align-items: baseline; margin-top: 9px; font-size: 12px; color: var(--dim); }
  .rc-ratio b { font-size: 13px; color: var(--ink); }

  .miss { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .miss .m { font-size: 11.5px; font-weight: 600; background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 3px 8px; }
  .miss .h { font-size: 11.5px; font-weight: 600; background: var(--ok-soft); color: var(--ok); border-radius: 6px; padding: 3px 8px; }
  .miss .u { font-size: 11.5px; font-weight: 600; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 3px 8px; }

  /* ---------- AI ---------- */
  .btn.ai { background: linear-gradient(135deg, #5b46e0, #254bdb); border-color: transparent; color: #fff; }
  .btn.ai:hover { filter: brightness(1.08); color: #fff; }
  .btn.ai:disabled { filter: grayscale(.4); }
  .badge.ai { background: #ece9fd; color: #5b46e0; }

  .ai-hint { font-size: 12.5px; color: var(--dim); margin: 0 0 14px; line-height: 1.7; }
  .ai-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .ai-pick .chip { font-weight: 600; }
  .ai-pick .chip .d { font-weight: 500; color: var(--faint); margin-left: 4px; font-size: 11px; }
  .ai-pick .chip[aria-pressed="true"] .d { color: var(--brand-ink); }

  .ai-working { display: grid; place-items: center; gap: 12px; padding: 34px 10px;
                color: var(--dim); font-size: 13.5px; text-align: center; }
  .ai-error { background: var(--bad-soft); color: #8d2b25; border-radius: var(--r-sm);
              padding: 10px 13px; font-size: 12.5px; margin-top: 12px; }

  /* 최근 요리 기록 (DB 의 fridge_cook_log) */
  .cooklog { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; font-size: 12.5px; color: var(--faint); }
  .cooklog .c { background: var(--paper); border: 1px solid var(--line-soft); border-radius: 999px;
                padding: 4px 12px; font-weight: 600; color: var(--dim); }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(23,33,60,.42);
    display: grid; place-items: center; padding: 18px; z-index: 50;
  }
  .modal {
    background: var(--paper); border-radius: 20px; width: min(560px, 100%);
    max-height: 88vh; overflow: auto; box-shadow: 0 40px 80px -40px rgba(24,45,105,.6);
  }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 20px 22px 14px; border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: var(--paper); z-index: 2; }
  .modal-head h2 { font-size: 18px; margin: 0; letter-spacing: -.4px; }
  .modal-head .sub { font-size: 12px; color: var(--faint); margin-top: 1px; }
  .modal-body { padding: 18px 22px 22px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 0 22px 22px; flex-wrap: wrap; }
  .x { margin-left: auto; border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--faint); cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .x:hover { background: #f2f5fb; color: var(--ink); }

  .form { display: grid; gap: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.lb { display: grid; gap: 5px; font-size: 12px; font-weight: 700; color: var(--dim); }
  label.lb .field { font-weight: 500; color: var(--ink); width: 100%; }

  ol.steps { margin: 0; padding-left: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
  ol.steps li { counter-increment: s; display: flex; gap: 11px; font-size: 13.5px; }
  ol.steps li::before {
    content: counter(s); flex: none; width: 22px; height: 22px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand-ink); font-size: 11.5px; font-weight: 700;
    display: grid; place-items: center; margin-top: 3px;
  }
  .ing-line { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line-soft); font-size: 13.5px; }
  .ing-line:last-child { border-bottom: 0; }
  .ing-line .q { margin-left: auto; color: var(--dim); font-size: 12.5px; }
  .dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
  .dot.y { background: var(--ok); } .dot.n { background: var(--bad); } .dot.u { background: var(--warn); }

  h3.sec { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
  h3.sec:first-child { margin-top: 0; }

  /* ---------- shopping ---------- */
  .shop-row { display: flex; align-items: center; gap: 11px; padding: 12px 16px; background: var(--paper);
              border: 1px solid var(--line-soft); border-radius: var(--r-sm); }
  .shop-row.done { opacity: .5; }
  .shop-row.done .nm { text-decoration: line-through; }
  .shop-row .nm { font-size: 14px; font-weight: 600; }
  .shop-row .src { font-size: 11.5px; color: var(--faint); }
  .cb { width: 18px; height: 18px; accent-color: var(--brand); cursor: pointer; flex: none; }

  .empty { text-align: center; padding: 54px 20px; color: var(--faint); font-size: 13.5px;
           background: var(--paper); border: 1px dashed var(--line); border-radius: var(--r); }
  .empty .big { font-size: 30px; display: block; margin-bottom: 8px; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
           background: var(--navy); color: #fff; font-size: 13.5px; font-weight: 600;
           padding: 11px 20px; border-radius: 999px; z-index: 80; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5);
           max-width: calc(100vw - 32px); }
  .toast.bad { background: var(--bad); }

  footer.foot { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line-soft);
                display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--faint); flex-wrap: wrap; }

  @media (max-width: 860px) {
    .grid.g3 { grid-template-columns: repeat(2, 1fr); }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .wrap { padding: 28px 16px 70px; }
    h1 { font-size: 25px; }
    .grid.g3, .grid.g2 { grid-template-columns: 1fr; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef, useCallback } = React;

/* =========================================================
   1. 유틸 — 날짜 계산은 화면 쪽에서 한다 (서버는 "2026-09-25" 문자열만 준다)
   ========================================================= */

const DAY = 86400000;

function today() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

/** 유통기한까지 남은 일수 (오늘이면 0, 지났으면 음수) */
function daysLeft(iso) {
  if (!iso) return null;
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return null;
  return Math.round((d - today()) / DAY);
}

/** 남은 일수 -> 신선도 배지 */
function freshness(iso) {
  const n = daysLeft(iso);
  if (n === null) return { key: "none", label: "기한 없음", cls: "neutral" };
  if (n < 0) return { key: "expired", label: Math.abs(n) + "일 지남", cls: "expired" };
  if (n === 0) return { key: "urgent", label: "오늘까지", cls: "urgent" };
  if (n <= 2) return { key: "urgent", label: "D-" + n, cls: "urgent" };
  if (n <= 5) return { key: "soon", label: "D-" + n, cls: "soon" };
  return { key: "fresh", label: "D-" + n, cls: "fresh" };
}

const showNum = (n) => (Math.round(n * 100) / 100).toString();

/** "3분 전" 같은 상대 시각 (요리 기록용) */
function ago(iso) {
  const t = new Date(iso);
  if (isNaN(t)) return "";
  const s = Math.max(0, (Date.now() - t.getTime()) / 1000);
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  return Math.floor(s / 86400) + "일 전";
}

/* =========================================================
   2. 서버 호출 — 쓰기 요청은 바뀐 뒤의 전체 상태를 돌려받는다
   ========================================================= */

async function api(path, options) {
  const res = await fetch("/api" + path, {
    method: (options && options.method) || "GET",
    headers: options && options.body ? { "Content-Type": "application/json" } : undefined,
    body: options && options.body ? JSON.stringify(options.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch { /* 본문이 JSON 이 아닐 수도 있다 */ }
  if (!res.ok) {
    throw new Error((data && data.detail) || `서버 오류 (${res.status})`);
  }
  return data;
}

/* =========================================================
   3. 레시피 매칭 — 서버가 준 재료/레시피를 화면에서 대조한다
   ========================================================= */

function matchRecipe(recipe, ingredients) {
  const byName = new Map(ingredients.map((i) => [i.name, i]));
  const lines = recipe.need.map((n) => {
    const have = byName.get(n.name);
    let status = "ok";
    if (!have) status = "none";
    else if (have.unit === n.unit && have.qty < n.qty) status = "low";
    return { ...n, status, have };
  });
  const required = lines.filter((l) => !l.optional);
  const okCount = required.filter((l) => l.status === "ok").length;
  return {
    lines,
    okCount,
    total: required.length,
    ratio: required.length ? okCount / required.length : 1,
    missing: required.filter((l) => l.status !== "ok"),
    canCook: okCount === required.length,
  };
}

/** 이 레시피에 쓰이는 재료 중 유통기한이 임박한 것(D-2 이내) 개수 */
function urgentUsed(recipe, ingredients) {
  const byName = new Map(ingredients.map((i) => [i.name, i]));
  return recipe.need.filter((n) => {
    const have = byName.get(n.name);
    if (!have) return false;
    const d = daysLeft(have.expiresAt);
    return d !== null && d <= 2;
  }).length;
}

/* =========================================================
   4. 작은 컴포넌트들
   ========================================================= */

function Stat({ k, v, unit, tone }) {
  return (
    <div className={"stat" + (tone ? " is-" + tone : "")}>
      <div className="k">{k}</div>
      <div className="v">{v}{unit && <small>{unit}</small>}</div>
    </div>
  );
}

function Modal({ title, sub, onClose, children, foot }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <h2>{title}</h2>
            {sub && <div className="sub">{sub}</div>}
          </div>
          <button className="x" onClick={onClose} aria-label="닫기">×</button>
        </div>
        <div className="modal-body">{children}</div>
        {foot && <div className="modal-foot">{foot}</div>}
      </div>
    </div>
  );
}

function Empty({ icon, children }) {
  return <div className="empty"><span className="big">{icon}</span>{children}</div>;
}

/* ---------- 재료 카드 ---------- */

function IngredientCard({ item, onEdit, onRemove, onQty }) {
  const f = freshness(item.expiresAt);
  return (
    <div className="card">
      <div className="ing-top">
        <div className="ing-emoji">{item.emoji}</div>
        <div style={{ minWidth: 0 }}>
          <div className="ing-name">{item.name}</div>
          <div className="ing-meta">{item.storage} · {item.category}</div>
        </div>
        <div className="ing-qty">

const SORTS = [
  { key: "expiry", label: "유통기한 임박순" },
  { key: "name", label: "이름순" },
  { key: "category", label: "분류순" },

function FridgeTab({ ingredients, options, onAdd, onEdit, onRemove, onQty }) {
  const [q, setQ] = useState("");
  const [cat, setCat] = useState("전체");
  const [storage, setStorage] = useState("전체");
  const [sort, setSort] = useState("expiry");
  const [onlyUrgent, setOnlyUrgent] = useState(false);

  const list = useMemo(() => {
    const kw = q.trim().toLowerCase();
    let out = ingredients.filter((i) => {
      if (kw && !i.name.toLowerCase().includes(kw)) return false;
      if (cat !== "전체" && i.category !== cat) return false;
      if (storage !== "전체" && i.storage !== storage) return false;
      if (onlyUrgent) {
        const d = daysLeft(i.expiresAt);
        if (d === null || d > 2) return false;
      }
      return true;
    });
    out = [...out];
    if (sort === "expiry") {
      out.sort((a, b) => (daysLeft(a.expiresAt) ?? 9999) - (daysLeft(b.expiresAt) ?? 9999));
    } else if (sort === "name") {
      out.sort((a, b) => a.name.localeCompare(b.name, "ko"));
    } else {
      out.sort((a, b) =>
        a.category.localeCompare(b.category, "ko") || a.name.localeCompare(b.name, "ko"));
    }
    return out;
  }, [ingredients, q, cat, storage, sort, onlyUrgent]);

  return (
    <>
      <div className="toolbar">
        <input
          className="field search"
          placeholder="재료 검색 (예: 달걀)"
          value={q}
          onChange={(e) => setQ(e.target.value)}
        />
        <select className="field" value={storage} onChange={(e) => setStorage(e.target.value)}>
          <option value="전체">보관 전체</option>
          {options.storages.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
        <select className="field" value={sort} onChange={(e) => setSort(e.target.value)}>
          {SORTS.map((s) => <option key={s.key} value={s.key}>{s.label}</option>)}
        </select>
        <button
          className="chip"
          aria-pressed={onlyUrgent}
          onClick={() => setOnlyUrgent((v) => !v)}
          style={{ padding: "8px 14px" }}
        >
          ⚠️ 임박한 것만
        </button>
        <button className="btn primary" onClick={onAdd}>+ 재료 추가</button>
      </div>

      <div className="chips">
        {["전체", ...options.categories].map((c) => (
          <button key={c} className="chip" aria-pressed={cat === c} onClick={() => setCat(c)}>{c}</button>
        ))}
      </div>

      {list.length === 0 ? (
        <Empty icon="🧊">조건에 맞는 재료가 없어요. 필터를 바꾸거나 재료를 추가해 보세요.</Empty>
      ) : (
        <div className="grid g3">
          {list.map((item) => (
            <IngredientCard key={item.id} item={item} onEdit={onEdit} onRemove={onRemove} onQty={onQty} />
          ))}
        </div>
      )}
    </>
  );
}

function RecipeTab({ recipes, ingredients, cooks, ai, onOpen, onAi }) {

  const [mode, setMode] = useState("all"); // all | ready | urgent

    const kw = q.trim().toLowerCase();
    return recipes
      .map((r) => ({ recipe: r, match: matchRecipe(r, ingredients), urgent: urgentUsed(r, ingredients) }))
      .filter(({ recipe, match, urgent }) => {
        if (kw) {
          const hay = (recipe.name + recipe.desc + recipe.tags.join("") +
            recipe.need.map((n) => n.name).join("")).toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        if (mode === "ready" && !match.canCook) return false;
        if (mode === "urgent" && urgent === 0) return false;
        return true;
      })
      .sort((a, b) =>
        b.match.ratio - a.match.ratio ||
        b.urgent - a.urgent ||
        a.recipe.minutes - b.recipe.minutes);
  }, [recipes, ingredients, q, mode]);

  return (
    <>
      <div className="toolbar">

          className="field search"
          placeholder="레시피 · 재료 · 태그 검색 (예: 파스타)"

          <button className="chip" aria-pressed={mode === "ready"} onClick={() => setMode("ready")} style={{ padding: "8px 14px" }}>✅ 지금 만들 수 있는 것</button>

/* =========================================================
   6. App — 상태는 전부 서버(PostgreSQL)에 있고, 화면은 받아서 그린다
   ========================================================= */

const EMPTY_OPTIONS = { categories: [], storages: [], units: [] };

function App() {
  const [data, setData] = useState(null);      // { ingredients, recipes, shopping, cooks, options, db }
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);     // 쓰기 요청 진행 중
  const [fatal, setFatal] = useState("");      // 첫 로딩 실패 (서버/DB 문제)
  const [tab, setTab] = useState("fridge");
  const [editing, setEditing] = useState(null);
  const [openId, setOpenId] = useState(null);
  const [aiOpen, setAiOpen] = useState(false);
  const [aiWorking, setAiWorking] = useState(false);
  const [aiError, setAiError] = useState("");
  const [toast, setToast] = useState(null);
  const timer = useRef(null);

  const say = useCallback((text, bad) => {
    setToast(text ? { text, bad } : null);
    clearTimeout(timer.current);
    if (text) timer.current = setTimeout(() => setToast(null), 2600);
  }, []);

  /* ---- 첫 로딩 ---- */
  const load = useCallback(async () => {
    setLoading(true);
    setFatal("");
    try {
      setData(await api("/state"));
    } catch (e) {
      setFatal(e.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);

  /* ---- 쓰기 요청 한 군데로 모으기 ----
     성공하면 서버가 돌려준 전체 상태로 통째로 갈아끼운다.
     실패하면 화면은 그대로 두고 토스트로만 알린다 (낙관적 갱신 안 함 = 화면과 DB 가 어긋나지 않음) */
  const mutate = useCallback(async (path, options, fallbackMsg) => {
    setBusy(true);
    try {
      const next = await api(path, options);
      setData(next);
      if (next.message || fallbackMsg) say(next.message || fallbackMsg);
      return next;
    } catch (e) {
      say(e.message, true);
      return null;
    } finally {
      setBusy(false);
    }
  }, [say]);

  /* ---- 재료 ---- */
  const saveIngredient = async (item) => {
    const ok = item.id
      ? await mutate(`/ingredients/${item.id}`, { method: "PATCH", body: item })
      : await mutate("/ingredients", { method: "POST", body: item });
    if (ok) setEditing(null);
  };

  const removeIngredient = (item) => {
    if (!window.confirm(`${item.name} 을(를) 냉장고에서 뺄까요?`)) return;
    mutate(`/ingredients/${item.id}`, { method: "DELETE" });
  };

  const bumpQty = (id, delta) => mutate(`/ingredients/${id}/bump`, { method: "POST", body: { delta } });

  /* ---- 요리 / 장보기 ---- */
  const cook = async (recipe) => {
    const ok = await mutate(`/recipes/${recipe.id}/cook`, { method: "POST" });
    if (ok) setOpenId(null);
  };

  /* ---- AI 레시피 ----
     mutate 를 안 쓰고 따로 두는 이유: 오래 걸리고(5~15초) 실패가 흔해서,
     화면 전체를 흐리는 대신 모달 안에서 진행/오류를 보여 준다. */
  const generateAI = async ({ note, use }) => {
    setAiWorking(true);
    setAiError("");
    try {
      const next = await api("/ai/recipe", { method: "POST", body: { note, use } });
      setData(next);
      setAiOpen(false);
      setTab("recipe");
      if (next.createdRecipeId) setOpenId(next.createdRecipeId);   // 만든 레시피를 바로 펼쳐 준다
      if (next.message) say(next.message);
    } catch (e) {
      setAiError(e.message);
    } finally {
      setAiWorking(false);
    }
  };

  const deleteRecipe = async (recipe) => {
    if (!window.confirm(`${recipe.name} 레시피를 지울까요?`)) return;
    const ok = await mutate(`/recipes/${recipe.id}`, { method: "DELETE" });
    if (ok) setOpenId(null);
  };

  const addMissingToShopping = async (recipe, match) => {
    const items = match.missing.map((m) => ({ name: m.name, qty: m.qty, unit: m.unit, from: recipe.name }));
    const ok = await mutate("/shopping", { method: "POST", body: { items } });
    if (ok) { setOpenId(null); setTab("shop"); }
  };

  const addManual = (name) => mutate("/shopping", { method: "POST", body: { items: [{ name }] } });
  const toggleShop = (id) => mutate(`/shopping/${id}/toggle`, { method: "POST" });
  const removeShop = (id) => mutate(`/shopping/${id}`, { method: "DELETE" });
  const clearDone = () => mutate("/shopping/clear-done", { method: "POST" });

  const stockUp = async () => {
    const ok = await mutate("/shopping/stock-up", { method: "POST" });
    if (ok) setTab("fridge");
  };

  const reset = () => {
    if (!window.confirm("DB 의 재료·장보기·요리 기록을 지우고 처음 시드 데이터로 되돌릴까요?")) return;
    mutate("/reset", { method: "POST" });
  };

  /* ---- 통계 ---- */
  const stats = useMemo(() => {
    if (!data) return { total: 0, urgent: 0, expired: 0, ready: 0 };
    let urgent = 0, expired = 0;
    data.ingredients.forEach((i) => {
      const d = daysLeft(i.expiresAt);
      if (d === null) return;
      if (d < 0) expired++;
      else if (d <= 2) urgent++;
    });
    const ready = data.recipes.filter((r) => matchRecipe(r, data.ingredients).canCook).length;
    return { total: data.ingredients.length, urgent, expired, ready };
  }, [data]);

  const openRecipe = data && openId ? data.recipes.find((r) => r.id === openId) : null;
  const openMatch = openRecipe ? matchRecipe(openRecipe, data.ingredients) : null;
  const options = (data && data.options) || EMPTY_OPTIONS;
  const ai = (data && data.ai) || { enabled: false, model: "" };

  /* ---- 화면 ---- */

  const header = (
    <>
      <div className="eyebrow">week4 · quest</div>
      <h1>냉장고 파먹기 🧊</h1>
      <p className="lead">
        집에 있는 재료를 등록하면, 지금 바로 만들 수 있는 요리를 매칭률 순으로 알려줘요.
        유통기한이 임박한 재료부터 쓰게 정렬하고, 모자란 건 장보기 목록으로 모아 줍니다.
      </p>
    </>
  );

  if (loading) {
    return (
      <div className="wrap">
        {header}
        <div className="loading"><div className="spin" />서버에서 냉장고를 여는 중…</div>
      </div>
    );
  }

  if (fatal) {
    return (
      <div className="wrap">
        {header}
        <div className="banner bad">
          <div>
            <b>DB 에 연결하지 못했습니다.</b><br />
            {fatal}<br />
            이 앱은 <code>node server.js</code> 로 서버를 띄운 뒤 <code>localhost:8791</code> 로 열어야 동작합니다.
            파일을 더블클릭해서 <code>file://</code> 로 열면 서버가 없어 이 화면이 나옵니다.
          </div>
          <button className="btn" onClick={load}>다시 시도</button>
        </div>
      </div>
    );
  }

  return (
    <div className="wrap">
      {header}

      <div className="stats">
        <Stat k="냉장고 재료" v={stats.total} unit="개" />
        <Stat k="임박 (D-2 이내)" v={stats.urgent} unit="개" tone={stats.urgent ? "warn" : null} />
        <Stat k="기한 지남" v={stats.expired} unit="개" tone={stats.expired ? "bad" : null} />
        <Stat k="바로 가능한 요리" v={stats.ready} unit="개" tone={stats.ready ? "ok" : null} />
      </div>

      <div className="tabs" role="tablist">
        <button role="tab" aria-selected={tab === "fridge"} onClick={() => setTab("fridge")}>
          냉장고 <span className="count">{data.ingredients.length}</span>
        </button>
        <button role="tab" aria-selected={tab === "recipe"} onClick={() => setTab("recipe")}>
          레시피 <span className="count">{data.recipes.length}</span>
        </button>
        <button role="tab" aria-selected={tab === "shop"} onClick={() => setTab("shop")}>
          장보기 <span className="count">{data.shopping.length}</span>
        </button>
      </div>

      <div className={"dim-while-busy" + (busy ? " busy" : "")}>
        {tab === "fridge" && (
          <FridgeTab
            ingredients={data.ingredients}
            options={options}
            onAdd={() => setEditing({})}
            onEdit={(item) => setEditing(item)}
            onRemove={removeIngredient}
            onQty={bumpQty}
          />
        )}

        {tab === "recipe" && (
          <RecipeTab
            recipes={data.recipes}
            ingredients={data.ingredients}
            cooks={data.cooks}
            ai={ai}
            onOpen={(r) => setOpenId(r.id)}
            onAi={() => { setAiError(""); setAiOpen(true); }}
          />
        )}

        {tab === "shop" && (
          <ShopTab
            shopping={data.shopping}
            busy={busy}
            onToggle={toggleShop}
            onRemove={removeShop}
            onAddManual={addManual}
            onClearDone={clearDone}
            onStockUp={stockUp}
          />
        )}
      </div>

      <footer className="foot">
        <span className="mono">PostgreSQL</span>
        <span>· {data.db ? `${data.db.host} / ${data.db.database}` : "DB 정보 없음"}</span>
        <button className="btn ghost sm" style={{ marginLeft: "auto" }} onClick={reset} disabled={busy}>
          데이터 초기화
        </button>
      </footer>

      {editing && (
        <IngredientForm
          initial={editing.id ? editing : null}
          options={options}
          onSave={saveIngredient}
          onClose={() => setEditing(null)}
        />
      )}

      {openRecipe && (
        <RecipeModal
          recipe={openRecipe}
          match={openMatch}
          busy={busy}
          onClose={() => setOpenId(null)}
          onCook={cook}
          onAddToShopping={addMissingToShopping}
          onDelete={deleteRecipe}
        />
      )}

      {aiOpen && (
        <AiModal
          ingredients={data.ingredients}
          model={ai.model}
          working={aiWorking}
          error={aiError}
          onClose={() => setAiOpen(false)}
          onGenerate={generateAI}
        />
      )}

      {toast && <div className={"toast" + (toast.bad ? " bad" : "")}>{toast.text}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
